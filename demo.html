<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Carregando…</title>
</head>
<body style="margin:0;background:#0f0f10">
<p style="color:#999;font:14px system-ui;text-align:center;padding-top:45vh;margin:0">Carregando prévia…</p>
<script src="js/niches.js"></script>
<script src="js/site.js"></script>
<script>
(async function () {
  function bytes(b64) {
    const s = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
    const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u;
  }
  async function decode() {
    const p = new URLSearchParams(location.search);
    const s = p.get('s');
    if (s) {
      const kind = s[0], data = bytes(s.slice(1));
      if (kind === 'z') {
        const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return JSON.parse(await new Response(stream).text());
      }
      return JSON.parse(new TextDecoder().decode(data));
    }
    if (p.get('d')) return JSON.parse(new TextDecoder().decode(bytes(p.get('d'))));
    return { n: p.get('n') || 'Barbearia Exemplo', c: p.get('c') || 'Barbearia', ci: 'Palmas, TO', t: '(63) 99999-0000', a: 'Av. JK, 100 - Centro, Palmas - TO', r: 4.9, u: 188 };
  }
  let d;
  try { d = await decode(); } catch (e) { document.body.innerHTML = '<p>Link de prévia inválido ou incompleto.</p>'; return; }
  const html = LSite.page(d, { exported: false });
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.documentElement.replaceChild(document.importNode(doc.head, true), document.head);
  document.documentElement.replaceChild(document.importNode(doc.body, true), document.body);
  document.title = doc.title;
  LSite.boot();
})();
</script>
</body>
</html>
